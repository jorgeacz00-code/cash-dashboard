<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cash Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div class="app">
    <!-- navbar -->
    <nav class="nav">
      <button id="btnMenu" class="icon-btn" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="nav-title">Operator Hack</span>
      <select id="yearPick" class="year-pick" aria-label="Año"></select>
    </nav>

    <!-- hero -->
    <section class="hero">
      <div class="big-title">Cash collected</div>
      <div class="hero-sub" id="heroSub">—</div>
      <div class="hero-value" id="heroValue">$0</div>
      <div class="hero-delta" id="heroDelta"></div>
    </section>

    <!-- filtro negocio -->
    <div class="seg" id="negSeg">
      <button data-neg="all" class="active">Todos</button>
      <button data-neg="agencia">Agencia</button>
      <button data-neg="consultoria">Consultoría</button>
      <button data-neg="bicicletas">Bicicletas</button>
    </div>

    <!-- periodo -->
    <div class="period-row">
      <div class="seg" id="periodSeg">
        <button data-p="today">Hoy</button>
        <button data-p="week">Semana</button>
        <button data-p="month">Mes</button>
        <button data-p="year" class="active">Año</button>
      </div>
      <button id="btnRange" class="icon-btn range-toggle" aria-label="Rango de fechas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      </button>
    </div>
    <div class="range" id="rangeBox">
      <label>Desde <input type="date" id="from" /></label>
      <label>Hasta <input type="date" id="to" /></label>
      <button id="applyRange" class="btn">Aplicar</button>
    </div>

    <!-- gráfica -->
    <section class="card chart-card">
      <div class="chart-head">
        <div class="chart-title">Evolución</div>
        <div class="chart-sub" id="chartSub">—</div>
      </div>
      <div class="chart-wrap">
        <svg id="chart" preserveAspectRatio="none"></svg>
        <div id="tooltip" class="tooltip hidden"></div>
      </div>
      <div class="x-axis" id="xAxis"></div>
    </section>

    <!-- por negocio -->
    <section class="card byneg" id="byNeg">
      <div class="byneg-title">Por negocio</div>
      <div class="stack" id="negStack"></div>
      <div class="stack-legend" id="negLegend"></div>
    </section>

    <!-- recibido en -->
    <div class="sec-head">Recibido en</div>
    <section class="dest-grid" id="destGrid"></section>

    <p class="foot">Los importes son editables (menú ▸ Editar datos) y se guardan en este navegador.<br/>Cuando conectes las APIs de los bancos sustituirán estos datos.</p>
  </div>

  <!-- drawer menú izquierda -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <h2>Menú</h2>
    <div class="menu">
      <button id="mEdit">Editar datos <span class="chev">›</span></button>
      <button id="mReset" class="danger">Restablecer datos de ejemplo</button>
    </div>
  </aside>

  <!-- modal editor -->
  <div class="modal-scrim" id="editScrim">
    <div class="modal">
      <div class="modal-head">
        <h3>Editar datos</h3>
        <button id="editClose" class="btn plain">Hecho</button>
      </div>
      <div class="modal-body">
        <table>
          <thead><tr><th>Fecha</th><th>Negocio</th><th>Recibido en</th><th>Importe</th><th></th></tr></thead>
          <tbody id="dataBody"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button id="addRow" class="btn plain">+ Añadir pago</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
